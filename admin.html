<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Grocery System - Firestore</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, doc, getDocs, getDoc, setDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBEVutHD46Si_G9HNgzVPKAvaxmV0U-cME",
            authDomain: "smartgrocery-9f884.firebaseapp.com",
            databaseURL: "https://smartgrocery-9f884-default-rtdb.firebaseio.com",
            projectId: "smartgrocery-9f884",
            storageBucket: "smartgrocery-9f884.appspot.com",
            messagingSenderId: "983846952457",
            appId: "1:983846952457:web:2a7d254aafe06c34dd62d8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadProducts() {
            const productListBody = document.getElementById('product-list-body');
            productListBody.innerHTML = ''; 

            const querySnapshot = await getDocs(collection(db, "store-products"));
            querySnapshot.forEach((doc) => {
                const product = doc.data();
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="p-2 border">${product.id}</td>
                    <td class="p-2 border">${product.name}</td>
                    <td class="p-2 border">₹${product.price.toFixed(2)}</td>
                    <td class="p-2 border">${product.stock}</td>
                    <td class="p-2 border">
                        <img src="${product.image}" alt="${product.name}" class="w-16 h-16 object-cover">
                    </td>
                    <td class="p-2 border">
                        <button onclick="editProduct('${product.id}')" class="text-blue-500 mr-2">Edit</button>
                        <button onclick="deleteProduct('${product.id}')" class="text-red-500">Delete</button>
                    </td>
                `;
                productListBody.appendChild(row);
            });
        }

        document.getElementById('product-form').addEventListener('submit', async function (e) {
            e.preventDefault();

            const productId = document.getElementById('product-id').value;
            const productName = document.getElementById('product-name').value;
            const productPrice = document.getElementById('product-price').value;
            const productStock = document.getElementById('product-stock').value;
            const productImage = document.getElementById('product-image').value;

            try {
                await setDoc(doc(db, "store-products", productId), {
                    id: productId,
                    name: productName,
                    price: parseFloat(productPrice),
                    stock: parseInt(productStock),
                    image: productImage
                });
                alert('Product saved successfully!');
                loadProducts();
                document.getElementById('product-form').reset();
            } catch (error) {
                console.error("Error saving product: ", error);
                alert('Failed to save product');
            }
        });

        window.editProduct = async function (productId) {
            const productDoc = await getDoc(doc(db, "store-products", productId));
            if (productDoc.exists()) {
                const product = productDoc.data();
                document.getElementById('product-id').value = product.id;
                document.getElementById('product-name').value = product.name;
                document.getElementById('product-price').value = product.price;
                document.getElementById('product-stock').value = product.stock;
                document.getElementById('product-image').value = product.image;
            } else {
                alert("Product not found!");
            }
        };

        window.deleteProduct = async function (productId) {
            if (confirm('Are you sure you want to delete this product?')) {
                try {
                    await deleteDoc(doc(db, "store-products", productId));
                    alert('Product deleted successfully');
                    loadProducts();
                } catch (error) {
                    console.error("Error deleting product: ", error);
                }
            }
        };

        document.getElementById('update-product-btn').addEventListener('click', async function () {
            const productId = document.getElementById('product-id').value;
            const productName = document.getElementById('product-name').value;
            const productPrice = document.getElementById('product-price').value;
            const productStock = document.getElementById('product-stock').value;
            const productImage = document.getElementById('product-image').value;

            try {
                await updateDoc(doc(db, "store-products", productId), {
                    name: productName,
                    price: parseFloat(productPrice),
                    stock: parseInt(productStock),
                    image: productImage
                });
                alert('Product updated successfully!');
                loadProducts();
                document.getElementById('product-form').reset();
            } catch (error) {
                console.error("Error updating product: ", error);
                alert('Failed to update product');
            }
        });

        window.onload = loadProducts;
    </script>
    <style>
        .input {
            padding: 0.5rem;
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 0.25rem;
            font-size: 1rem;
        }

        .button {
            padding: 0.5rem 1rem;
            background-color: #4caf50;
            color: #fff;
            border: none;
            border-radius: 0.25rem;
            cursor: pointer;
            font-size: 1rem;
        }

        .button:hover {
            background-color: #3e8e41;
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
<div class="container mx-auto p-4">
    <h1 class="text-3xl font-bold mb-6 text-center text-gray-800">Smart Grocery System</h1>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-xl font-bold mb-4">Product Management</h2>
            <form id="product-form" class="space-y-4">
                <input type="text" id="product-id" class="input" placeholder="Product ID" required>
                <input type="text" id="product-name" class="input" placeholder="Product Name" required>
                <input type="number" id="product-price" class="input" placeholder="Price (₹)" step="0.01" required>
                <input type="number" id="product-stock" class="input" placeholder="Stock Quantity" required>
                <input type="text" id="product-image" class="input" placeholder="Product Image URL" required>
                <div class="grid grid-cols-2 gap-4">
                    <button type="submit" class="button">Save Product</button>
                    <button type="button" id="update-product-btn" class="button bg-green-500">Update Product</button>
                </div>
            </form>
        </div>
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-xl font-bold mb-4">Product List</h2>
            <table class="w-full border-collapse">
                <thead>
                    <tr class="bg-gray-200">
                        <th class="p-2 border">Product ID</th>
                        <th class="p-2 border">Name</th>
                        <th class="p-2 border">Price</th>
                        <th class="p-2 border">Stock</th>
                        <th class="p-2 border">Image</th>
                        <th class="p-2 border">Actions</th>
                    </tr>
                </thead>
                <tbody id="product-list-body"></tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
